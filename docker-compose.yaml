services:
  configsvr:
    image: mongo:8.0
    container_name: configsvr
    command: mongod --configsvr --replSet configReplSet --port 27017 --bind_ip_all
    volumes:
      - configsvr_data:/data/configdb
    networks:
      - mongo-cluster

  shard1:
    image: mongo:8.0
    container_name: shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard1_data:/data/db
    networks:
      - mongo-cluster

  shard2:
    image: mongo:8.0
    container_name: shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard2_data:/data/db
    networks:
      - mongo-cluster

  shard3:
    image: mongo:8.0
    container_name: shard3
    command: mongod --shardsvr --replSet shard3ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard3_data:/data/db
    networks:
      - mongo-cluster
  
  mongos:
    image: mongo:8.0
    container_name: mongos
    command: mongos --configdb configReplSet/configsvr:27017 --port 27017 --bind_ip_all
    ports:
      - "27030:27017"
    volumes:
      - ./configuracion:/scripts/configuracion:ro
      - ./crud:/scripts/crud:ro
    depends_on:
      - configsvr
    networks:
      - mongo-cluster

volumes:
  configsvr_data:
  shard1_data:
  shard2_data:
  shard3_data:

networks:
  mongo-cluster: